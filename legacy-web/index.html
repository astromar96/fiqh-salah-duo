<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>فقه الصلاة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="phone">
    <header id="hud">
      <div class="hud-item" id="hud-streak"><span class="ico">🔥</span><span class="val">0</span></div>
      <div class="hud-item" id="hud-xp"><span class="ico">💎</span><span class="val">0</span></div>
      <div class="hud-item" id="hud-hearts"><span class="ico">❤️</span><span class="val">5</span></div>
    </header>
    <main id="screens">
      <section id="screen-path" class="screen active"></section>
      <section id="screen-lesson" class="screen"></section>
      <section id="screen-done" class="screen"></section>
    </main>
    <div id="toast"></div>
  </div>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
